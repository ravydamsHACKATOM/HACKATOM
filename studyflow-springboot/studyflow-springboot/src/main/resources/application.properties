spring.application.name=StudyFlow
server.port=8080

spring.datasource.url=jdbc:sqlite:./data/studyflow.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always

spring.jackson.serialization.write-dates-as-timestamps=false

studyflow.ai.api-key=${OPENAI_API_KEY:}
studyflow.ai.model=${OPENAI_MODEL:gpt-6-luna}
