
name: CI

on:
  pull_request:
  push:

jobs:
  build:
    name: Test and verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studyflow-springboot/studyflow-springboot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21.0.7
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.7'
          cache: maven
          cache-dependency-path: studyflow-springboot/studyflow-springboot/pom.xml

      - name: Run Checkstyle
        run: bash ./mvnw -B -ntp checkstyle:check

      - name: Run tests and verify package
        run: bash ./mvnw -B -ntp clean verify

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-reports
          path: studyflow-springboot/studyflow-springboot/target/surefire-reports/**
          if-no-files-found: warn
