
name: CI

on:
  pull_request:
  push:

jobs:
  build:
    name: Test and verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studyFlow/studyFlow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: studyFlow/studyFlow/pom.xml

      - name: Run tests and verify package
        run: ./mvnw -B -ntp clean verify

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: studyFlow/studyFlow/target/surefire-reports/**
          if-no-files-found: warn
