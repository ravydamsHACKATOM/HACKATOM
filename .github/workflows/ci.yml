
name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studyFlow/studyFlow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: studyFlow/studyFlow/pom.xml

      - name: Build backend
        run: ./mvnw -B -ntp clean package -DskipTests
