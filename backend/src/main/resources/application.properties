spring.application.name=studyflow
server.port=${PORT:8080}

# SQLite: a single file, zero setup. One pooled connection avoids SQLITE_BUSY on writes.
spring.datasource.url=jdbc:sqlite:${STUDYFLOW_DB:./data/studyflow.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.web.resources.cache.period=0

# Time zone used to decide what "today" and "now" mean for the student.
studyflow.zone=${STUDYFLOW_ZONE:America/Sao_Paulo}

# Optional AI advisor. Without a key the app falls back to the rule-based advisor.
studyflow.ai.api-key=${ANTHROPIC_API_KEY:}
studyflow.ai.model=${STUDYFLOW_AI_MODEL:claude-opus-5-5}
studyflow.ai.base-url=${STUDYFLOW_AI_BASE_URL:https://api.anthropic.com}
studyflow.ai.timeout-seconds=20
