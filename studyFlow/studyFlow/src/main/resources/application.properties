
spring.application.name=studyFlow

# Configuração do SQLite
spring.datasource.url=jdbc:sqlite:${STUDYFLOW_DB_PATH:${user.home}/.studyflow/study-flow.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Configuração do Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Exibir comandos SQL no console
spring.jpa.show-sql=${STUDYFLOW_SQL_LOG:false}
spring.jpa.properties.hibernate.format_sql=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
studyflow.cors.allowed-origins=${STUDYFLOW_CORS_ORIGINS:http://localhost:8080}
